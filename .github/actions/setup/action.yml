name: Setup workspace
description: Installs pnpm, Node and (optionally) a JDK, then installs dependencies from the lockfile.

inputs:
  java:
    description: >-
      Install a JDK. Required for any job that starts the Firestore or Storage
      emulators, which are Java processes.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # pnpm must be installed before setup-node, because `cache: pnpm` needs the
    # pnpm binary to locate the store directory. The version is read from the
    # root package.json `packageManager` field, so it cannot drift from what
    # developers run locally.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - if: inputs.java == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    # --frozen-lockfile makes CI fail if the lockfile and the manifests disagree,
    # rather than silently resolving something a reviewer never saw.
    - run: pnpm install --frozen-lockfile
      shell: bash
